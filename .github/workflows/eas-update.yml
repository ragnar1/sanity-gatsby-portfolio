name: EAS Update

on:
  push:
    branches:
      - claude/sailing-guide-ios-app-lf5mz
    paths:
      - sailing-app/**

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sailing-app/package-lock.json

      - name: Install dependencies
        working-directory: sailing-app
        run: npm install

      - name: Publish update to Expo
        working-directory: sailing-app
        run: npx eas-cli@latest update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
